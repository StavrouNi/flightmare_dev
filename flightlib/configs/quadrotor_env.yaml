quadrotor_env:
   camera: yes
   sim_dt: 0.02 
   max_t: 5.0
   add_camera: yes
   init_pos: [-10.0, 0.0, 2.5]  # initial position of the quadrotor (x, y, z)
   gates:
      # --- CENTER SPINE (Start) ---
      # 1. The Low Center Gate (Fly straight through)
      - pos: [0.0, 0.0, 2.5]
        yaw: 0.0  # Face Forward

      # --- RIGHT WING ---
      # 2. Front Right Corner (Bank Right)
      - pos: [8.0, 4.0, 2.5]
        yaw: 0.78 # 45 deg

      # 3. Back Right Corner (Sharp Turn Back)
      - pos: [8.0, -4.0, 2.5]
        yaw: 2.35 # 135 deg

      # --- CROSSING ---
      # 4. The "Needle" (Crossing back through center, slightly higher)
      - pos: [0.0, 0.0, 4.0]
        yaw: 3.14 # 180 deg (Flying backwards relative to start)

      # --- LEFT WING ---
      # 5. Front Left Corner (Bank Left)
      - pos: [-8.0, 4.0, 2.5]
        yaw: 2.35 # 135 deg (Mirror of Gate 3)

      # 6. Back Left Corner (Sharp Turn Back)
      - pos: [-8.0, -4.0, 2.5]
        yaw: 0.78 # 45 deg (Mirror of Gate 2)

      # --- THE FINISHER (Split-S) ---
      # 7. The High Dive (Above Gate 1)
      - pos: [-2.0, 0.0, 6.0] 
        yaw: 0.0 # Face Forward, get ready to dive to Gate 1


quadrotor_dynamics:
  mass: 0.73
  arm_l: 0.17
  motor_omega_min: 150.0 # motor rpm min
  motor_omega_max: 3000.0 # motor rpm max
  motor_tau: 0.0001 # motor step response
  thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
  kappa: 0.016 # rotor drag coeff
  omega_max: [6.0, 6.0, 6.0]  # body rate constraint (x, y, z) 

rl:
  pos_coeff: -0.002        # reward coefficient for position 
  ori_coeff: -0.002        # reward coefficient for orientation
  lin_vel_coeff: -0.0002   # reward coefficient for linear velocity
  ang_vel_coeff: -0.0002   # reward coefficient for angular velocity
  act_coeff: -0.0002  # reward coefficient for control actions