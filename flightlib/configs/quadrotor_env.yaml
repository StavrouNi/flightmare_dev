quadrotor_env:
   camera: yes
   sim_dt: 0.02 
   max_t: 5.0
   init_pos: [-10.0, 0.0, 2.5]  # For circle track
   init_yaw: 0.0 # For circle track

  #  init_pos: [-2.0, 0.0, 2.5]   # For figure 8 track
  #  init_yaw: -0.36              # For figure 8 track

  #  init_pos: [2.0, -3.0, 2.5]   # Kidney Track
  #  init_yaw: 3.14             # Kidney Track

   gates:
    # ---  CIRCLE ---
    - pos: [-10.0, 3.0, 2.5]
      yaw: 0.0
    
    - pos: [-5.0, 8.0, 2.5]
      yaw:  1.57

    - pos: [0.0, 3.0, 2.5]
      yaw: 0.0

    - pos: [-5.0, -2.0, 2.5]
      yaw:  1.57
    # ---  CIRCLE END ---

    # --- Figure 8 track  ---
    # - pos: [6.0, -3.0, 2.5]
    #   yaw:  1.57            

    # - pos: [8.0, 0.0 , 2.5]
    #   yaw:  3.14159         

    # - pos: [6.0, 3.0 , 2.5]
    #   yaw: -1.57             

    # - pos: [-2.0, -3.0, 2.5]
    #   yaw:  -1.57             

    # - pos: [-4.0, 0.0 , 2.5]
    #   yaw:  3.14159          

    # - pos: [-2.0, 3.0 , 2.5]
    #   yaw: 1.57             
    # --- Figure 8 track end ---

    # --- Kidney Track  ---
    # - pos: [0.0, -3.0, 2.5]
    #   yaw:  1.57            

    # - pos: [-3.0, 0.0 , 2.5]
    #   yaw:  3.14159         

    # - pos: [0.0, 3.0 , 2.5]
    #   yaw: 3.14159             

    # - pos: [-3.0, 6.0, 2.5]
    #   yaw:  3.14159             

    # - pos: [0.0, 9.0 , 2.5]
    #   yaw:  1.57          

    # - pos: [4.0, 3.0 , 2.5]
    #   yaw: 3.14159  
    # --- Kidney Track end --- 

quadrotor_dynamics:
  mass: 0.6 
  arm_l: 0.14
  motor_omega_min: 150.0 # motor rpm min
  motor_omega_max: 3000.0 # motor rpm max
  motor_tau: 0.0001 # motor step response
  thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
  kappa: 0.016 # rotor drag coeff
  omega_max: [6.0, 6.0, 6.0]  # body rate constraint (x, y, z) 

rl:
  pos_coeff: -0.002        # reward coefficient for position 
  ori_coeff: -0.002        # reward coefficient for orientation
  lin_vel_coeff: -0.0002   # reward coefficient for linear velocity
  ang_vel_coeff: -0.0002   # reward coefficient for angular velocity
  act_coeff: -0.0002  # reward coefficient for control actions